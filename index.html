<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>解压</title>
<style>
:root{
  --canvas:#ffffff;
  --ink:#1c1c1e;
  --secondary:#8e8e93;
  --tertiary:#c7c7cc;
  --accent:#ff6a3d;
  --track:#ececef;
  --heat:0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--canvas);overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
#fx{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

/* 白底上只留一层极淡的暖晕，让按钮有落点 */
.glow{
  position:fixed;left:50%;top:50%;width:120vmin;height:120vmin;z-index:0;pointer-events:none;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,180,120,.16) 0%,rgba(255,180,120,.05) 38%,rgba(255,255,255,0) 66%);
  opacity:calc(.5 + var(--heat) * .5);
  transition:opacity .35s ease-out;
}

.shell{
  position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
  padding:calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.combo{
  position:absolute;left:0;right:0;top:calc(6px + env(safe-area-inset-top));
  text-align:center;pointer-events:none;
  opacity:0;transform:translateY(-6px) scale(.96);
  transition:transform .28s cubic-bezier(.22,1.4,.36,1);
}
.combo.show{opacity:1;transform:translateY(0) scale(1)}
.combo .n{
  display:inline-block;font-size:clamp(46px,13.5vw,72px);line-height:1;font-weight:600;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums;color:var(--ink);
  transition:transform .12s ease-out;
}
.combo .n.pop{transform:scale(1.1)}
.combo .x{font-size:.44em;font-weight:500;color:var(--secondary);vertical-align:.16em;margin-right:.04em}

.stage{flex:1 1 auto;display:grid;place-items:center;width:100%;position:relative}

/* 按钮：白底上一枚有重量的圆，阴影负责落地 */
.pad{
  position:relative;width:min(62vw,260px);aspect-ratio:1/1;border:0;padding:0;border-radius:50%;
  background:#fff;cursor:pointer;pointer-events:auto;
  box-shadow:
    0 1px 2px rgba(60,40,20,.10),
    0 18px 34px -14px rgba(60,40,20,.42),
    0 0 0 1px rgba(60,40,20,.06);
  transition:transform .12s cubic-bezier(.22,1.4,.36,1), box-shadow .3s ease-out;
  will-change:transform;
}
.pad img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;
  filter:saturate(1.03) contrast(1.03)}
.pad::after{
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle at 50% -12%,rgba(255,255,255,.22),rgba(255,255,255,0) 40%),
    radial-gradient(circle at 50% 118%,rgba(70,45,20,.16),rgba(0,0,0,0) 44%);
}
.pad.down{transform:scale(.94);
  box-shadow:0 1px 2px rgba(60,40,20,.14), 0 8px 18px -10px rgba(60,40,20,.42), 0 0 0 1px rgba(60,40,20,.08)}
.pad.idle{animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}

.foot{flex:0 0 auto;width:min(100%,320px);display:flex;flex-direction:column;align-items:center;gap:14px}
.bar{width:100%;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:2px;background:var(--accent);
  transition:width .2s ease-out,background .3s}
.hint{margin:0;font-size:13px;letter-spacing:.02em;color:var(--secondary);
  transition:opacity .6s ease}
.hint.gone{opacity:0}

@media (min-width:900px){
  .pad{width:min(32vw,320px)}
}
@media (prefers-reduced-motion:reduce){
  .pad.idle{animation:none}
  .combo,.combo .n,.combo .x{transition:none}
}
</style>
</head>

    paintCombo(true);
  }

  window.addEventListener('pointerdown', function (e) {
    if (e.button && e.button !== 0) return;
    e.preventDefault();
    hit(e.clientX, e.clientY);
  }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(.05, (now - last) / 1000);
    last = now;
    if (combo > 0 && now - lastTap > 1350) { combo = 0; paintCombo(false); }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var sx = 0, sy = 0;
    if (shake > .15 && !reduced) {
      sx = rand(-shake, shake) * .6;
      sy = rand(-shake, shake) * .6;
      shake *= .86;
    } else { shake = 0; }
    ui.style.transform = sx || sy ? 'translate3d(' + (sx * .25).toFixed(2) + 'px,' + (sy * .25).toFixed(2) + 'px,0)' : '';
    ctx.translate(sx * .5, sy * .5);

    /* 叶子 */
    for (var i = leaves.length - 1; i >= 0; i--) {
      var L = leaves[i];
      L.sway += dt * 1.1;
      L.vx *= 0.995; L.vy *= 0.998;
      L.vy += (16 - L.vy) * dt * 0.6;
      L.x += (L.vx + Math.sin(L.sway) * L.swayAmp) * dt;
      L.y += L.vy * dt;
      L.rot += L.vr * dt;
      if (L.y > H + 40 || L.x < -60 || L.x > W + 60) { leaves.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = L.alpha;
      ctx.translate(L.x, L.y);
      ctx.rotate(L.rot);
      var w = L.sprite.width * L.scale, h = L.sprite.height * L.scale;
      ctx.drawImage(L.sprite, -w / 2, -h / 2, w, h);
      ctx.restore();
    }
    while (leaves.length < 24) spawnLeaf(true);

    /* 木屑 */
    for (var c = chips.length - 1; c >= 0; c--) {
      var ch = chips[c];
      ch.life += dt;
      if (ch.life > ch.max) { chips.splice(c, 1); continue; }
      ch.vy += 900 * dt;
      ch.vx *= .985;
      ch.x += ch.vx * dt; ch.y += ch.vy * dt;
      ch.rot += ch.vr * dt;
      var kc = 1 - ch.life / ch.max;
      ctx.save();
      ctx.globalAlpha = Math.min(1, kc * 2.4);
      ctx.translate(ch.x, ch.y);
      ctx.rotate(ch.rot);
      ctx.fillStyle = ch.c;
      ctx.fillRect(-ch.w / 2, -ch.h / 2, ch.w, ch.h);
      ctx.fillStyle = 'rgba(90,60,30,.35)';
      ctx.fillRect(-ch.w / 2, ch.h / 2 - 1, ch.w, 1);
      ctx.restore();
    }

    /* 锯末 */
    for (var d = dust.length - 1; d >= 0; d--) {
      var du = dust[d];
      du.life += dt;
      if (du.life > du.max) { dust.splice(d, 1); continue; }
      du.vy += 420 * dt;
      du.vx *= .96;
      du.x += du.vx * dt; du.y += du.vy * dt;
      var kd = 1 - du.life / du.max;
      ctx.globalAlpha = kd * .75;
      ctx.fillStyle = '#c49a6c';
      ctx.fillRect(Math.round(du.x), Math.round(du.y), du.s, du.s);
    }
    ctx.globalAlpha = 1;

    /* 冲击波：白底上省略，木屑本身已经说明撞击 */

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  var m = /demo=(\d+)/.exec(location.search);
  if (m) {
    var nDemo = Math.min(60, parseInt(m[1], 10) || 0);
    var cx0 = window.innerWidth / 2, cy0 = window.innerHeight * 0.5;
    var i2 = 0;
    (function fire() {
      if (i2++ >= nDemo) return;
      hit(cx0, cy0);
      setTimeout(fire, 70);
    })();
  }
})();
</script>
</body>
</html>
